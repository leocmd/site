<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title></title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700;800&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#dfe5ec;
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.75);
  --glass-shine:rgba(255,255,255,.75); --shadow:0 10px 34px rgba(20,30,50,.16),0 2px 6px rgba(20,30,50,.08);
  --label:rgba(0,0,0,.88); --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2); --row:rgba(255,255,255,.72);
  --seg-on:#ffffff; --knob:#ffffff; --sheet:rgba(242,242,247,.92); --sidebar:rgba(255,255,255,.55);
  --accent:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --teal:#30B0C7; --indigo:#5856D6; --purple:#AF52DE; --gray:#8E8E93; --brown:#A2845E; --cyan:#32ADE6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --letterbox:#000;
    --glass:rgba(28,28,30,.52); --glass-hi:rgba(44,44,46,.8); --glass-edge:rgba(255,255,255,.14);
    --glass-shine:rgba(255,255,255,.14); --shadow:0 10px 34px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
    --label:rgba(255,255,255,.95); --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --row:rgba(44,44,46,.72);
    --seg-on:#636366; --knob:#ffffff; --sheet:rgba(28,28,30,.92); --sidebar:rgba(44,44,46,.55);
    --accent:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --teal:#40C8E0; --indigo:#5E5CE6; --purple:#BF5AF2; --gray:#98989D; --brown:#AC8E68; --cyan:#64D2FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --letterbox:#000;
  --glass:rgba(28,28,30,.52); --glass-hi:rgba(44,44,46,.8); --glass-edge:rgba(255,255,255,.14);
  --glass-shine:rgba(255,255,255,.14); --shadow:0 10px 34px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --label:rgba(255,255,255,.95); --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --row:rgba(44,44,46,.72);
  --seg-on:#636366; --knob:#ffffff; --sheet:rgba(28,28,30,.92); --sidebar:rgba(44,44,46,.55);
  --accent:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --teal:#40C8E0; --indigo:#5E5CE6; --purple:#BF5AF2; --gray:#98989D; --brown:#AC8E68; --cyan:#64D2FF;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--letterbox);color:var(--label);display:flex;align-items:center;justify-content:center;
  font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;letter-spacing:-.01em}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}
#frame{position:fixed;inset:0;overflow:hidden;background:#bcd9ec}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#hud .ia{pointer-events:auto}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#1c1c1e;font-size:17px}

/* glass material */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
  border:.5px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-shine);pointer-events:auto}
.capsule{border-radius:999px}
.card{border-radius:26px}
.ico{display:grid;place-items:center}
.ico svg{display:block}

/* top bar */
.tl{position:absolute;left:24px;top:20px;display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 20px}
.cityname{font-size:17px;font-weight:600;outline:none;min-width:40px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;padding:2px 4px;border-radius:6px}
.cityname:hover{background:var(--fill)}
.date{color:var(--label2);font-size:15px;white-space:nowrap}
.dot{width:4px;height:4px;border-radius:2px;background:var(--label3)}
#fps{position:absolute;left:30px;top:80px;font-size:12px;color:var(--label2);pointer-events:none}
.tr{position:absolute;right:24px;top:20px;display:flex;gap:10px;align-items:center}
.stats{display:flex;align-items:center;gap:18px;height:52px;padding:0 20px}
.stat{display:flex;align-items:center;gap:7px;font-weight:600;font-size:16px;white-space:nowrap}
.stat small{font-weight:500;font-size:13px}
.up{color:var(--green)} .down{color:var(--red)}
.rbtn{width:52px;height:52px;border-radius:26px;border:0;display:grid;place-items:center;cursor:pointer;color:var(--label)}
.rbtn:hover{background:var(--glass-hi)}
.rbtn.on{color:var(--accent)}
.campill{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:26px}
.campill button{width:40px;height:40px;border:0;background:transparent;border-radius:20px;display:grid;place-items:center;cursor:pointer;color:var(--label)}
.campill button:hover{background:var(--fill)}

/* segmented control */
.segm{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:0;position:relative}
.segm button{flex:1 1 0;border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--label);display:flex;align-items:center;justify-content:center;gap:6px}
.segm button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.segm.small button{padding:5px 10px}
.speed{margin-left:6px;border-radius:999px}
.speed button{border-radius:999px;padding:7px 12px;min-width:44px}

/* switch */
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);border:0;position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}

/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:220px;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--fill2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--fill2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 3px 8px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.18)}

/* tab bar and palette */
.tabbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:999px}
.tab{width:84px;height:60px;border:0;background:transparent;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer;color:var(--label)}
.tab:hover{background:var(--fill)}
.tab.on{color:var(--accent);background:var(--glass-hi);box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 0 0 .5px var(--glass-edge)}
.palette{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);padding:14px;border-radius:28px;display:flex;flex-direction:column;gap:12px;max-width:1300px}
.prow{display:flex;gap:10px;align-items:center;justify-content:center}
.tcard{width:156px;border:0;background:var(--fill);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;text-align:left;color:var(--label)}
.tcard:hover{background:var(--fill2)}
.tcard.on{background:var(--glass-hi);box-shadow:inset 0 0 0 2px var(--accent)}
.tcard .tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tcard b{font-size:14px;font-weight:600;line-height:1.2}
.tcard small{font-size:12px;color:var(--label2);line-height:1.3}
.tcard .price{font-size:13px;font-weight:600;color:var(--accent)}
.hintline{font-size:13px;color:var(--label2);text-align:center}
.tcard.locked{opacity:.62}
.tcard.locked .price{color:var(--label2)}
.rci-mini{display:flex;gap:3px;align-items:center;padding-left:4px}
.rci-big{display:flex;gap:8px;align-items:flex-end;padding:8px 12px;margin-right:4px;background:var(--fill);border-radius:18px;align-self:stretch}
.rci-b{display:flex;flex-direction:column;align-items:center;gap:4px}
.rci-b small{font-size:11px;font-weight:600;color:var(--label2)}
.rci-t{position:relative;background:var(--fill2);border-radius:4px;overflow:hidden;display:block}
.rci-t::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--label3)}
.rci-t i{position:absolute;left:0;right:0;border-radius:3px}
.optrow{display:flex;align-items:center;gap:10px;font-size:14px}

/* side cards */
.lcol{position:absolute;left:24px;top:86px;width:340px;display:flex;flex-direction:column;gap:12px}
.rcol{position:absolute;right:92px;top:86px;width:360px}
.chead{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 10px}
.chead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.chead p{margin:3px 0 0;color:var(--label2);font-size:14px}
.closeb{margin-left:auto;width:30px;height:30px;border-radius:15px;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--label2);flex:0 0 auto}
.closeb:hover{background:var(--fill2)}
.cbody{padding:0 14px 16px;max-height:600px;overflow:auto}
.group{background:var(--row);border-radius:14px;overflow:hidden;margin-top:10px}
.ghead{font-size:13px;color:var(--label2);margin:16px 6px 0;font-weight:500}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 14px;position:relative}
.row + .row::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.row .k{flex:1;min-width:0}
.row .v{color:var(--label2);font-variant-numeric:tabular-nums;text-align:right}
.row .v.good{color:var(--green)} .row .v.bad{color:var(--red)} .row .v.warn{color:var(--orange)}
.row.btn{cursor:pointer;border:0;width:100%;background:transparent;text-align:left;color:var(--accent);font-weight:500}
.row.btn:hover{background:var(--fill)}
.row.danger{color:var(--red)}
.isq{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.chev{color:var(--label3)}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;width:120px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.grad{height:10px;border-radius:5px;margin:4px 0 6px}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--label2)}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.dem{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;padding:6px 14px}
.dem .track{height:10px;border-radius:5px;background:var(--fill2);position:relative;overflow:hidden}
.dem .track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--label3)}
.dem .track i{position:absolute;top:0;bottom:0;border-radius:5px;transition:left .3s,width .3s}
.armrow{display:flex;align-items:center;gap:10px;padding:8px 14px;position:relative}
.armrow + .armrow::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.armrow .k{flex:1}
.empty{padding:16px;color:var(--label2);text-align:center}

/* banners */
#banners{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:440px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;animation:bin .35s cubic-bezier(.2,.9,.3,1.2)}
.banner .isq{width:38px;height:38px;border-radius:10px}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:13px;font-weight:600;color:var(--label2)}
.banner .bt span{font-size:15px}
.banner .when{font-size:12px;color:var(--label3);align-self:flex-start}
.banner.out{animation:bout .3s forwards}
@keyframes bin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes bout{to{transform:translateY(-20px);opacity:0}}

/* tooltip */
#tip{position:absolute;padding:7px 12px;border-radius:14px;font-size:13px;font-weight:500;line-height:1.35;display:none;pointer-events:none;max-width:280px}
#tip .bad{color:var(--red)} #tip .muted{color:var(--label2)}

/* sheets */
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.22);display:grid;place-items:center;pointer-events:auto}
.sheet{width:940px;height:640px;border-radius:30px;display:flex;overflow:hidden;background:var(--sheet)}
.sheet.small{width:560px;height:auto;flex-direction:column}
.side{width:250px;background:var(--sidebar);padding:22px 12px;display:flex;flex-direction:column;gap:4px;border-right:.5px solid var(--sep)}
.side h1{font-size:28px;font-weight:700;margin:4px 10px 14px;letter-spacing:-.02em}
.sitem{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:16px;color:var(--label)}
.sitem:hover{background:var(--fill)}
.sitem.on{background:var(--accent);color:#fff}
.sitem.on .isq{box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.smain{flex:1;display:flex;flex-direction:column;min-width:0}
.sbar{display:flex;align-items:center;padding:20px 26px 6px}
.sbar h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.done{margin-left:auto;border:0;background:var(--accent);color:#fff;font-weight:600;padding:9px 20px;border-radius:999px;cursor:pointer}
.done:hover{filter:brightness(1.08)}
.scontent{flex:1;overflow:auto;padding:4px 26px 26px}
.foot{font-size:13px;color:var(--label2);margin:8px 6px 0;line-height:1.4}
.wbody{padding:6px 28px 26px;line-height:1.5}
.wbody ol{margin:6px 0 10px;padding-left:22px}
.wbody li{margin:4px 0}
.wbody p{color:var(--label2);font-size:14px;margin:8px 0}
.bigbtn{display:block;width:100%;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:17px;padding:14px;border-radius:16px;cursor:pointer;margin-top:14px}
@media (prefers-reduced-motion: reduce){ .banner,.banner.out{animation:none} .switch,.switch::after,.dem .track i{transition:none} }
/* ---------- compact palettes ---------- */
.palette{padding:10px 12px}
.tcard{position:relative;width:96px;padding:10px 8px 9px;border-radius:16px;align-items:center;text-align:center;gap:5px}
.tcard .tile{width:36px;height:36px;border-radius:10px}
.tcard b{font-size:13px}
.tcard .price{font-size:12px}
.tcard .info{position:absolute;top:5px;right:5px;width:17px;height:17px;border-radius:50%;font:600 11px/17px Georgia,serif;font-style:italic;color:var(--label2);background:var(--fill);opacity:.75}
.tcard .info:hover,.tcard .info.show{opacity:1;color:var(--label)}
.tcard .info::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);width:210px;padding:9px 11px;border-radius:12px;background:var(--sheet);color:var(--label);font:400 13px/1.35 -apple-system,BlinkMacSystemFont,"Inter",system-ui,sans-serif;font-style:normal;text-align:left;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:5;white-space:normal}
.tcard .info:hover::after,.tcard .info.show::after{opacity:1;transform:translateX(-50%) translateY(0)}
.optcol{display:flex;flex-direction:column;gap:6px;align-self:center;margin-left:4px}
.rci-big{padding:6px 10px}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
/* ---------- auto-hiding toolbars ---------- */
.tl,.tr,.tabbar,.campill{transition:opacity .28s ease,transform .32s cubic-bezier(.2,.8,.2,1)}
.hideT .tl,.hideT .tr{opacity:0;transform:translateY(-22px);pointer-events:none}
.hideT .tr *{pointer-events:none}
.hideB .tabbar{opacity:0;transform:translateX(-50%) translateY(26px) !important;pointer-events:none}
.hideR .campill{opacity:0;transform:translateY(-50%) translateX(22px);pointer-events:none}
.edgeh{position:absolute;left:50%;bottom:6px;width:64px;height:6px;margin-left:-32px;border:0;border-radius:3px;background:var(--label3);opacity:0;transition:opacity .3s;cursor:pointer;padding:0}
.edgeh.top{top:6px;bottom:auto}
.hideB .edgeh:not(.top),.hideT .edgeh.top{opacity:.55}
/* ---------- chronicle, town hall, citizens ---------- */
.mast{font-weight:700;letter-spacing:0}
.news{background:var(--row);border-radius:14px;padding:11px 13px;margin-bottom:8px}
.news .nhead{display:flex;gap:8px;align-items:center}
.news .nhead b{font-size:15px;line-height:1.25}
.news p{margin:6px 0 6px;font-size:13.5px;line-height:1.42;color:var(--label)}
.news .nfoot{display:flex;justify-content:space-between;align-items:center;color:var(--label2)}
.go{border:0;background:var(--fill);color:var(--accent);font-weight:600;font-size:12.5px;border-radius:999px;padding:4px 10px;cursor:pointer;flex:none}
.go:hover{background:var(--fill2)}
.pill{border:0;background:var(--fill);border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
.pill.yes{background:var(--accent);color:#fff}
.chips2{display:flex;gap:6px;flex-wrap:wrap;margin:0 2px 10px}
.chip2{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--fill)}
.thought{font-style:normal;font-size:15px;line-height:1.4;margin:0 4px 12px;color:var(--label)}
.nbadge{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--glass-hi)}
.rbtn{position:relative}
.rbtn.on{color:var(--accent)}
.empty{padding:20px;text-align:center;color:var(--label2)}
.flash{position:absolute;padding:6px 11px;border-radius:10px;background:rgba(28,28,30,.86);color:#fff;font-size:13px;font-weight:500;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.flash.on{opacity:1}
/* ---------- title, resume and postcards ---------- */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,rgba(0,0,0,.05),rgba(0,0,0,.35));z-index:20;padding:20px}
.tcard2{width:min(440px,100%);border-radius:30px;padding:30px 32px 24px;text-align:center}
.tcard2 h1{margin:12px 0 4px;font-size:40px;letter-spacing:-.03em}
.tcard2 .sub{margin:0 0 20px;color:var(--label2)}
.play{border:0;background:var(--accent);color:#fff;font-size:18px;font-weight:700;padding:15px 34px;border-radius:999px;cursor:pointer;box-shadow:0 8px 24px rgba(10,132,255,.35);transition:transform .15s}
.play:hover{transform:scale(1.04)}
.play:active{transform:scale(.97)}
.tlinks{margin-top:14px}
.tlinks button{border:0;background:var(--fill);color:var(--accent);font-weight:600;cursor:pointer;padding:9px 18px;border-radius:999px}
.tlinks button:hover{background:var(--fill2)}
.fshint{font-size:12.5px;color:var(--label2);margin:12px 0 0;min-height:1em}
.logo{display:flex;gap:6px;justify-content:center;align-items:flex-end;height:54px}
.logo span{width:22px;border-radius:5px 5px 2px 2px;animation:bob 2.4s ease-in-out infinite}
.lg1{height:30px;background:#34C759}.lg2{height:50px;background:#0A84FF;animation-delay:.2s !important}.lg3{height:38px;background:#FF9F0A;animation-delay:.4s !important}
@keyframes bob{50%{transform:translateY(-5px)}}
.newcity{text-align:left;margin-top:14px}
.newcity .bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.newcity .bopt{border:0;background:var(--fill);border-radius:14px;padding:10px;text-align:left;cursor:pointer}
.newcity .bopt.on{box-shadow:inset 0 0 0 2px var(--accent);background:var(--glass-hi)}
.newcity .bopt b{display:block;font-size:14px}
.newcity .bopt small{color:var(--label2);font-size:12px}
.newcity input{width:100%;border:0;background:var(--fill);border-radius:12px;padding:10px 12px;font:600 15px ui-monospace,Menlo,monospace;color:var(--label)}
.pcwrap{background:#fff;border-radius:10px;padding:14px 14px 10px;box-shadow:0 20px 60px rgba(0,0,0,.4);max-width:min(900px,92vw);text-align:center;color:#333}
.pcwrap img{display:block;width:100%;border-radius:4px}
.pcwrap .sub{color:#666;margin:10px 0 0;font-size:13px}
.pcwrap .tlinks button{color:#0A84FF}
/* ---------- photo mode ---------- */
.photobar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:14px;align-items:center;padding:10px 16px;border-radius:999px}
.photobar label{font-size:13px;color:var(--label2);display:flex;gap:8px;align-items:center}
.tilt{position:fixed;left:0;right:0;height:34%;pointer-events:none;backdrop-filter:blur(3.5px);-webkit-backdrop-filter:blur(3.5px);z-index:1}
.tilt.top{top:0;-webkit-mask-image:linear-gradient(to bottom,#000 30%,transparent);mask-image:linear-gradient(to bottom,#000 30%,transparent)}
.tilt.bot{bottom:0;-webkit-mask-image:linear-gradient(to top,#000 30%,transparent);mask-image:linear-gradient(to top,#000 30%,transparent)}
body.photo #hud > :not(#photobar){display:none !important}
body.photo #cv{filter:saturate(1.18) contrast(1.04)}

/* ---------- the weekly paper ---------- */
.rcol.wide{width:min(560px,calc(100% - 120px))}
.paper{background:var(--paper);border-radius:inherit;overflow:hidden;display:flex;flex-direction:column;max-height:inherit}
.mastrow{display:flex;justify-content:flex-end;padding:8px 10px 0}
.masthead{text-align:center;padding:0 18px 10px;border-bottom:2px solid var(--label)}
.masthead small{color:var(--label2);font-size:12px;letter-spacing:.04em}
.masthead h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 6px;line-height:1.1}
.mline{display:flex;justify-content:space-between;font-size:12.5px;color:var(--label2);border-top:1px solid var(--sep);padding-top:6px}
.ptabs{padding:10px 14px 2px}
.pbody{padding:4px 18px 8px}
.story{padding:11px 0;border-bottom:1px solid var(--sep)}
.story h3{font-size:16px;font-weight:700;margin:0 0 4px;line-height:1.3}
.story.lead h3{font-size:23px;font-weight:800;line-height:1.2;letter-spacing:-.01em}
.story p{margin:0;font-size:13.5px;line-height:1.55;color:var(--label)}
.sfoot{margin-top:7px}
.index .ix{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--sep)}
.index .ix b{font-size:14px;font-weight:600}
.index .ix small{color:var(--label2);white-space:nowrap}
.parch{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 12px;color:var(--label2)}
.go:disabled{opacity:.35;cursor:default}
#bNews.dim{opacity:.45}
.tsep{width:1px;align-self:stretch;margin:12px 2px;background:var(--sep)}
.tab.lockb{min-width:44px}
.tab.lockb.on{color:var(--accent)}
.nclab{display:block;font-size:12px;color:var(--label2);margin-top:8px}
.nclab input{display:block;margin-top:4px}
.ncsw{display:flex;gap:18px;margin-top:12px;font-size:13px;color:var(--label)}
.ncsw label{display:flex;align-items:center;gap:7px;cursor:pointer}
.ncsw input{margin:0;width:16px;height:16px;accent-color:var(--accent)}
:root{--paper:#fbf8f1}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#24221e}}
:root[data-theme="dark"]{--paper:#24221e}
:root[data-theme="light"]{--paper:#fbf8f1}
html:lang(ja) body,html:lang(ja) button,html:lang(ja) input{font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",Meiryo,system-ui,sans-serif}
html:lang(ja) .story p,html:lang(ja) .k{line-height:1.7;word-break:auto-phrase}
body.calm *,body.calm *::before,body.calm *::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
.mbtns{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.mbtns button:not(.play){border:0;background:var(--fill);border-radius:16px;padding:13px;font-weight:600;font-size:15px;color:var(--label);cursor:pointer}
.mbtns button:not(.play):hover{background:var(--fill2)}
.mbtns #mQuit{color:var(--red)}
.menub{border:0;background:none;color:var(--label);width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;margin:0 2px 0 -6px}
.menub:hover{background:var(--fill)}
.povchip{position:absolute;top:84px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:9px 16px;border-radius:999px;font-size:13.5px;font-weight:600;color:var(--label);z-index:4}
.povchip kbd{font:600 11px ui-monospace,Menlo,monospace;background:var(--fill);border-radius:6px;padding:2px 6px;margin-left:6px}
.povchip small{color:var(--label2);font-weight:500}
.tcard b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}
.olab{font-size:11px;color:var(--label2);text-align:center;font-weight:600;letter-spacing:.02em}
</style>
</head>

<script>
(() => {
'use strict';
/* =====================================================================
   CONSTANTS
   ===================================================================== */
const W = 96, H = 64;                        // world size in units
const TR = 2, TW = W * TR + 1, TH = H * TR + 1, TN = TW * TH;   // terrain vertex grid
const FN = W * H;                            // hidden simulation field cells (1 unit)
const WL = 0.5, MAXH = 7;
const ROAD_HW = 0.36, WALK = 0.15, LOT_OFF = 0.53;
const TICK = 0.4, SPEEDS = [0, 1, 2, 4];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MILESTONES = [[0, 'Hamlet'], [60, 'Village'], [250, 'Small town'], [600, 'Town'], [1200, 'Large town'], [2500, 'Small city'], [5000, 'City'], [10000, 'Big city'], [20000, 'Metropolis']];
const ZONES = {
  R: { name: 'Residential', depth: [1.45, 1.7, 2.0], w: [0.95, 1.1, 1.35], color: 0x5cc36b, ui: 'var(--green)', dens: [1, 2, 3] },
  C: { name: 'Commercial', depth: [1.5, 1.75, 2.0], w: [1.15, 1.3, 1.45], color: 0x3c8ff0, ui: 'var(--accent)', dens: [1, 2, 3] },
  O: { name: 'Offices', depth: [1.7, 1.9, 2.1], w: [1.3, 1.4, 1.5], color: 0x8e6cf0, ui: 'var(--purple)', dens: [2, 3] },
  I: { name: 'Industrial', depth: [2.0, 2.0, 2.0], w: [1.45, 1.45, 1.45], color: 0xf0a52e, ui: 'var(--orange)', dens: [1] },
};
const DENS = [0, 1, 2.3, 4.2], DENS_NAME = ['', 'Low', 'Medium', 'High'];
const POP = [0, 6, 14, 30], JOBC = [0, 4, 9, 18], JOBI = [0, 6, 13, 24], JOBO = [0, 8, 18, 34];
/* what each milestone unlocks (index into MILESTONES) */
const UNLOCK = { newsroom: 2, press: 99, lumber: 0, townhall: 1, plaza: 0, park: 1, coal: 0, wind: 0, pump: 0, well: 0, school: 1, police: 1, fire: 1, mine: 1, hospital: 2, oil: 2, O: 2, dens2: 2, dens3: 3 };
const UNLOCK_NAME = { school: 'Schools', police: 'Police stations', fire: 'Fire stations', mine: 'Ore mines', hospital: 'Hospitals', oil: 'Oil extractors', O: 'Office zoning', dens2: 'Medium density', dens3: 'High density' };
/* placeable buildings */
const SVC = {
  townhall: { name: 'Town hall', w: 2.0, d: 1.8, cost: 0, upkeep: 15, pw: 4, wt: 2, cat: 'svc', icon: 'columns', col: '#AF52DE', unique: true },
  newsroom: { name: 'Newsroom', w: 1.4, d: 1.2, cost: 900, upkeep: 20, pw: 3, wt: 1, cat: 'svc', icon: 'news', col: '#5E5CE6', unique: true, jobsO: 10 },
  press:    { name: 'Printing plant', w: 1.8, d: 1.4, cost: 1200, upkeep: 25, pw: 6, wt: 2, cat: 'svc', icon: 'factory', col: '#5E5CE6', unique: true, jobsI: 14 },
  lumber:   { name: 'Lumber mill', w: 1.6, d: 1.3, cost: 700, upkeep: 15, pw: 2, wt: 0, cat: 'svc', icon: 'leaf', col: '#8D6E4C', res: 'wood', income: 140, jobs: 8 },
  plaza:    { name: 'Community space', w: 1.6, d: 1.6, cost: 60, upkeep: 4, cat: 'svc', icon: 'people', col: '#30B0C7' },
  school:   { name: 'School', w: 1.8, d: 1.3, cost: 1800, upkeep: 60, radius: 11, field: 'edu', pw: 6, wt: 4, cat: 'svc', icon: 'book', col: '#5856D6' },
  hospital: { name: 'Hospital', w: 1.9, d: 1.6, cost: 2600, upkeep: 90, radius: 13, field: 'health', pw: 10, wt: 8, cat: 'svc', icon: 'cross', col: '#FF3B30' },
  fire:     { name: 'Fire station', w: 1.4, d: 1.5, cost: 1400, upkeep: 50, radius: 19, field: 'fire', pw: 4, wt: 6, cat: 'svc', icon: 'flame', col: '#FF9500' },
  police:   { name: 'Police station', w: 1.35, d: 1.3, cost: 1300, upkeep: 50, radius: 19, field: 'police', pw: 4, wt: 2, cat: 'svc', icon: 'shield', col: '#007AFF' },
  park:     { name: 'Park', w: 1.7, d: 1.7, cost: 350, upkeep: 8, radius: 6, field: 'park', pw: 0, wt: 0, cat: 'svc', icon: 'leaf', col: '#34C759' },
  coal:     { name: 'Coal power plant', w: 1.7, d: 1.7, cost: 1500, upkeep: 80, power: 500, cat: 'util', icon: 'factory', col: '#8E8E93' },
  wind:     { name: 'Wind turbine', w: 0.7, d: 0.7, cost: 500, upkeep: 12, power: 90, cat: 'util', icon: 'fan', col: '#30B0C7' },
  pump:     { name: 'Water pump', w: 1.0, d: 1.0, cost: 600, upkeep: 45, water: 520, cat: 'util', icon: 'drop', col: '#007AFF' },
  well:     { name: 'Groundwater well', w: 0.9, d: 0.9, cost: 350, upkeep: 20, water: 180, cat: 'util', icon: 'well', col: '#5AC8FA' },
  mine:     { name: 'Ore mine', w: 1.5, d: 1.5, cost: 1200, upkeep: 30, jobs: 24, income: 70, pw: 8, res: 'ore', cat: 'res', icon: 'pick', col: '#A2845E' },
  oil:      { name: 'Oil extractor', w: 1.4, d: 1.4, cost: 1600, upkeep: 40, jobs: 18, income: 90, pw: 8, res: 'oil', cat: 'res', icon: 'derrick', col: '#5E5CE6' },
};
const POLLUTER = { coal: 10, mine: 3, oil: 5, I: 4.4 };
const V_ROAD = 0.95, A_LAT = 0.36, B_COMF = 0.9, CAR_LEN = 0.34;
const DIFF = { easy: { money: 80000, upkeep: 0.75, tax: 1.2 }, normal: { money: 50000, upkeep: 1, tax: 1 }, hard: { money: 30000, upkeep: 1.3, tax: 0.85 } };

/* =====================================================================
   SETTINGS
   ===================================================================== */
const SETTINGS_KEY = 'tinycity-settings-v4';
const DEFAULTS = {
  lang: (navigator.language || 'en').toLowerCase().startsWith('ja') ? 'ja' : 'en', pseudo: false, dayNight: true, appearance: 'auto', resScale: 1, fpsMode: 'display', showFps: false, fov: 45, uiScale: 1, pinBars: false,
  quality: 'high', shadows: 'high', water: 'animated', trees: 1, drawDist: 'far', dayNight: true, dayLen: 6,
  pedestrians: true, traffic: 1, difficulty: 'normal', sandbox: false, unlockAll: false, fires: true, autosave: 2,
  edgeScroll: false, camSpeed: 1, invertRotate: false, snapAngles: true, blockSize: 5,
  muted: false, volMaster: 0.8, volSfx: 0.8, volAmb: 0.6, volUi: 0.5, volMusic: 0.45,
};
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) {}
function saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {} }

/* =====================================================================
   UTILITIES
   ===================================================================== */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth01 = t => t <= 0 ? 0 : t >= 1 ? 1 : t * t * (3 - 2 * t);
const hash = n => { n = Math.imul((n | 0) ^ ((n | 0) >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return (n ^ (n >>> 16)) >>> 0; };
const hash01 = n => { n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); n = Math.imul(n ^ (n >>> 16), 0x45d9f3b); return ((n ^ (n >>> 16)) >>> 0) / 4294967296; };
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rng = mulberry(1);
function makeNoise(seed) {
  const r = mulberry(seed), perm = new Uint8Array(512), p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  for (let i = 255; i > 0; i--) { const j = (r() * (i + 1)) | 0; const t = p[i]; p[i] = p[j]; p[j] = t; }
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  const val = (x, y) => perm[(perm[x & 255] + y) & 511] / 255;
  const n2 = (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    const a = val(ix, iy), b = val(ix + 1, iy), c = val(ix, iy + 1), d = val(ix + 1, iy + 1);
    return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
  };
  return (x, y, oct = 4) => { let s = 0, amp = 0.5, f = 1; for (let o = 0; o < oct; o++) { s += n2(x * f, y * f) * amp; f *= 2; amp *= 0.5; } return s; };
}

/* =====================================================================
   WORLD STATE
   ===================================================================== */
const hm = new Float32Array(TN);         // terrain heights
const lockV = new Uint8Array(TN);        // vertices held in place under roads and buildings
const ore = new Float32Array(FN), oil = new Float32Array(FN), gw = new Float32Array(FN);
const air = new Float32Array(FN), gnd = new Float32Array(FN), tmpF = new Float32Array(FN), srcF = new Float32Array(FN);
const trafF = new Float32Array(FN), treeCell = new Uint8Array(FN);
const flowX = new Float32Array(FN), flowZ = new Float32Array(FN);
const cov = { edu: new Float32Array(FN), health: new Float32Array(FN), fire: new Float32Array(FN), police: new Float32Array(FN), park: new Float32Array(FN) };
let terraStrength = 1;
let world = { seed: 1, ph: 0, lx: 40, lz: 50, lr: 5, biome: 'valley', code: '', sandbox: { money: false, unlock: false }, town: null };
let tickN = 0, calAcc = 0;
const DAY_SEC = 150 / 7;   // one calendar day; a week (one edition) is about 2.5 minutes
let money = 50000, day = 0, lastNet = 0, speed = 1, budget = null, cityName = '';
let popPrev = 0, popDelta = 0, msReached = 0;
const stats = { pop: 0, jc: 0, ji: 0, jo: 0, advice: [], pCap: 0, pUse: 0, wCap: 0, wUse: 0, exports: 0, homeAir: 0, noPower: 0, noWater: 0, unemp: 0, happy: 70, homes: 0, xActive: 0, fires: 0, edu: 0, health: 0, safety: 0, leisure: 0 };
let dem = { R: 0, C: 0, I: 0, O: 0 };
const sandbox = () => world.sandbox || {};
const unlocked = k => sandbox().unlock || UNLOCK[k] === undefined || msReached >= UNLOCK[k];

const fcell = (x, z) => clamp(Math.floor(z), 0, H - 1) * W + clamp(Math.floor(x), 0, W - 1);
function terrainY(x, z) {
  const u = clamp(x * TR, 0, TW - 1), v = clamp(z * TR, 0, TH - 1);
  const ix = Math.min(u | 0, TW - 2), iz = Math.min(v | 0, TH - 2), fu = u - ix, fv = v - iz;
  const a = iz * TW + ix, h00 = hm[a], h10 = hm[a + 1], h01 = hm[a + TW], h11 = hm[a + TW + 1];
  return fu >= fv ? h00 + (h10 - h00) * fu + (h11 - h10) * fv : h00 + (h11 - h01) * fu + (h01 - h00) * fv;
}
const surfY = (x, z) => Math.max(terrainY(x, z), WL);
const isWater = (x, z) => terrainY(x, z) < WL - 0.02;
const inMap = (x, z, m = 0) => x >= m && z >= m && x <= W - m && z <= H - m;

/* =====================================================================
   WORLD GENERATION
   ===================================================================== */
const riverZ = (x) => H * 0.42 + Math.sin(x * 0.085 + world.ph) * 6 + Math.sin(x * 0.031 + world.ph * 2) * 7;

/* =====================================================================
   CAMERA
   ===================================================================== */
const HOME = { tx: W / 2, tz: H / 2 + 6, yaw: 0.55, pitch: 0.92, dist: 48 };

  rig.dist = clamp(rig.dist, 3.5, 110); rig.pitch = clamp(rig.pitch, 0.22, 1.45);
}
function applyCam(dt) {
  const k = 1 - Math.exp(-dt * 12);
  cur.tx += (rig.tx - cur.tx) * k; cur.tz += (rig.tz - cur.tz) * k; cur.yaw += (rig.yaw - cur.yaw) * k;
  cur.pitch += (rig.pitch - cur.pitch) * k; cur.dist += (rig.dist - cur.dist) * k;

  const cond = (m <= 1 || m === 11) ? (h < 45 ? 'snow' : h < 75 ? 'clouds' : 'sun') : (m >= 5 && m <= 7) ? (h < 15 ? 'storm' : h < 30 ? 'clouds' : 'sun') : (h < 35 ? 'rain' : h < 65 ? 'clouds' : 'sun');
  return { m, f: WX_F[m] + (h % 9) - 4, cond };
}
const wxText = w => jaL() ? `${Math.round((w.f - 32) * 5 / 9)}°C · ${T('wx.' + w.cond)}` : `${w.f}°F · ${T('wx.' + w.cond)}`;
/* ---------- printing ---------- */
function blotter(items) {
  const C = [...lots.values()].filter(l => l.type === 'C' && l.level), R2 = [...lots.values()].filter(l => l.type === 'R' && l.level);
  let busy = null, bt = 0.7; for (const sg of segs.values()) if (sg.traffic > bt) { bt = sg.traffic; busy = sg; }
  const pool = [];
  if (busy) pool.push({ k: 'blot.fender', p: { st: streetRef(busy.id) } });
  if (C.length && R2.length && people.some(p => hasT(p, 'night'))) pool.push({ k: 'blot.noise', p: { st: streetRef(pickR(C).seg) } });
  if ([...svcs.values()].some(v => v.type === 'park' || v.type === 'plaza')) { const s = pickR([...svcs.values()].filter(v => v.type === 'park' || v.type === 'plaza')); pool.push({ k: 'blot.cat', p: { st: streetRef(s.seg) } }); }
  if (R2.length) pool.push({ k: 'blot.dog', p: { st: streetRef(pickR(R2).seg) } });
  for (const b of pool.sort(() => Math.random() - 0.5).slice(0, 2)) items.push({ ...b, sec: 'community', imp: 1 });
}
function classifieds(items) {
  const workers = stats.pop * 0.55, jobs = stats.jc + stats.ji + stats.jo;
  if (jobs - workers > 15) { const l = pickR([...lots.values()].filter(l => l.type !== 'R' && l.level)); if (l) items.push({ k: 'classHelp', p: { n: Math.round(Math.min(40, (jobs - workers) / 4)), place: l.biz || { t: 'q', v: 'place.' + l.type + '.short' }, st: streetRef(l.seg) }, sec: 'business', imp: 1 }); }
  if (dem.R < -5) { const l = pickR(resList); if (l) items.push({ k: 'classRent', p: { st: streetRef(l.seg) }, sec: 'business', imp: 1 }); }
  if (Math.random() < 0.4 && people.length) { const p = pickR(people), h = lots.get(p.home); if (h) items.push({ k: 'classSale', p: { thing: { t: 'q', v: 'sale.' + (hash(day) % 6) }, st: streetRef(h.seg) }, sec: 'business', imp: 0 }); }
  const bizs = [...lots.values()].filter(l => l.biz);
  for (const l of bizs.sort(() => Math.random() - 0.5).slice(0, 2)) items.push({ k: 'ad', p: { biz: l.biz, st: streetRef(l.seg), tag: { t: 'q', v: 'tag.' + l.biz.k } }, sec: 'business', imp: 0, x: l.cx, z: l.cz });
}
function letters(items) {
  const ppl = people.filter(p => lots.get(p.home)).sort((a, b) => Math.max(...b.op) - Math.max(...a.op)).slice(0, 2);
  for (const p of ppl) { if (Math.max(...p.op) < 0.45) continue; const h = lots.get(p.home); items.push({ k: 'letter', p: { q: { t: 'q', v: 'q.' + p.worry }, who: Ref.pn(p), st: streetRef(h.seg) }, sec: 'community', imp: 1, x: h.cx, z: h.cz }); }
}
const SEC_CAP = { front: 1, town: 4, community: 3, business: 3, sports: 3 };
function printEdition() {
  const opened = publishCommits(), items = [], no = ++civ.paperNo;
  if (no === 1) { civ.mascot = hash(world.seed) % 8; items.push({ k: 'first', p: { town: { t: 'town' } }, sec: 'front', imp: 6 }); achieve('paper'); }
  for (const c of opened) items.push({ k: c.src === 'mayor' ? 'mayorSets' : 'commitNew', p: { what: Ref.what(c.issue), di: c.dist, due: Ref.date(c.due), who: civ.mayor && person(civ.mayor) ? Ref.pn(person(civ.mayor)) : '' }, sec: 'town', imp: 4, x: c.px, z: c.pz });
  for (const n of civ.news) items.push({ ...n, sec: n.sec === 'notices' ? 'town' : n.sec });
  civ.news = [];
  const wk = budget ? budget.inc.reduce((s, r) => s + r[1], 0) * 12.5 : 0, we = budget ? budget.exp.reduce((s, r) => s + r[1], 0) * 12.5 : 0;
  items.push({ k: 'notices', p: { n: civ.permits || 0, inc: Ref.mon(wk), exp: Ref.mon(we) }, sec: 'town', imp: 0 });
  civ.permits = 0;
  blotter(items); letters(items); classifieds(items); sportsWeek(items);
  // keep it readable: a lead story and a few items per section
  items.sort((a, b) => b.imp - a.imp);
  const out = [], cnt = {};
  for (const it of items) { const s = it.sec || 'town'; cnt[s] = (cnt[s] || 0) + 1; if (cnt[s] <= (SEC_CAP[s] || 2)) out.push(it); }
  if (out.length) out[0].lead = true;
  const ed = { no, day, items: out.slice(0, 14), wx: weatherFor(day) };
  civ.editions.unshift(ed); if (civ.editions.length > 12) civ.editions.pop();
  // the van takes the paper round town; the edition lands when the round is done
  const press = [...svcs.values()].find(v => v.type === 'newsroom'), far = resList.length ? resList[(Math.random() * resList.length) | 0] : null;
  if (press && far) { const r = nearestSeg(press.ax, press.az, 3); if (r) { const v = buildCar({ seg: r.seg, t: r.t }, far, 2); if (v) { v.col = 0x2f6fd1; cars.push(v); } } }

}

function paperHTML() {
  const ed = civ.editions[paperView] || civ.editions[0];

  let body = '';

    const seen = new Set([lead && lead.k]);
    body = (lead ? storyHTML(lead, true) : '') + `<div class="index">${ed.items.filter(i => i !== lead && i.imp >= 1 && !seen.has(T('n.' + i.k + '.t', rp(i.p))) && seen.add(T('n.' + i.k + '.t', rp(i.p)))).slice(0, 4).map(i => `<div class="ix"><b>${T('n.' + i.k + '.t', rp(i.p))}</b><small>${T(SECS.find(s => s[0] === i.sec) ? SECS.find(s => s[0] === i.sec)[1] : 'paper.town')}</small></div>`).join('')}</div>`;
  } else body = ed.items.filter(i => i.sec === paperTab).map(i => storyHTML(i)).join('') || `<div class="empty">${T('paper.quiet')}</div>`;

}

hudEl.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-set]'); if (!t) return;
  const d = t.dataset, stop = () => { e.stopImmediatePropagation(); e.preventDefault(); };
  if (d.svc) { resFilter = SVC[d.svc].res || (d.svc === 'well' ? 'gw' : null); terrainColorDirty = true; }
  if (d.act === 'closeLegend' && viewsFromMenu) { stop(); autoView = false; setOverlay(0); renderViews(); $('views').hidden = false; return; }
  if (d.view) viewsFromMenu = true;
  if (d.act === 'chronicle' || d.act === 'paper') { stop(); if (!civ.editions.length) { if (rcard === 'paper') closeCard(); else openCard('paper'); return; } if (rcard === 'paper') closeCard(); else { paperView = 0; civ.readNo = civ.unread; sfx('paper'); openCard('paper'); } return; }
  if (d.act === 'paperOlder') { stop(); paperView = Math.min(civ.editions.length - 1, paperView + 1); uiDirty = true; return; }
  if (d.act === 'paperNewer') { stop(); paperView = Math.max(0, paperView - 1); uiDirty = true; return; }
  if (d.act === 'lockBars') { stop(); settings.pinBars = !settings.pinBars; saveSettings(); renderTabbar(); sfx('toggle'); barPeek = 1; return; }
  if (d.act === 'pov') { stop(); const w = peds.find(p => p.pid === selPerson); if (w) startPOV(w, 'ped'); else flashTip(T('pov.indoors')); return; }
  if (d.act === 'playPause') { stop(); setSpeed(speed ? 0 : 1); sfx('toggle'); return; }
  if (d.set === 'paperTab') { stop(); paperTab = d.v; uiDirty = true; return; }
  if (d.set === 'lang') { stop(); settings.lang = d.v; applySetting('lang'); return; }
}, true);

/* =====================================================================
   PAUSE MENU AND RIDE-ALONG CAMERA
   A real pause stops the simulation and the sound. Esc or the ☰ button
   opens the menu; Quit returns to the title screen. Clicking a car, or
   "See through their eyes" on a resident, rides along with them.
   ===================================================================== */
let menuSpeed = 1, hardPaused = false;
function hardPause(on) {
  if (on === hardPaused) return;
  hardPaused = on;
  if (on) { menuSpeed = speed || 1; setSpeed(0); if (AU.ctx && AU.ctx.state === 'running') AU.ctx.suspend(); }
  else { if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); setSpeed(menuSpeed); }
}
function openMenu() {
  if (!started || !$('title').hidden) return;
  if (pov) stopPOV();
  hardPause(true);
  $('menuTitle').textContent = cityName; $('menuSub').textContent = `${calDate(day)} · ${T('city.pop', { n: fmtN(stats.pop) })}`;
  $('mResume').textContent = T('menu.resume'); $('mSave').textContent = T('menu.save'); $('mSettings').textContent = T('set.title'); $('mNew').textContent = T('menu.newTown'); $('mQuit').textContent = T('menu.quit');
  $('menu').hidden = false;
}
function closeMenu(resume) { $('menu').hidden = true; if (resume) hardPause(false); }
$('mResume').onclick = () => closeMenu(true);
$('mSave').onclick = () => { save(); sfx('pick'); $('mSave').textContent = T('menu.saved'); };
$('mSettings').onclick = () => { closeMenu(false); openSheet('settings'); };
$('mQuit').onclick = () => { closeMenu(false); hardPaused = false; showTitle(); };
$('mNew').onclick = () => { closeMenu(false); hardPaused = false; showTitle(); showCreation(true); };
$('menu').addEventListener('click', e => { if (e.target.id === 'menu') closeMenu(true); });
document.querySelector('.tl').insertAdjacentHTML('afterbegin', `<button class="menub ia" id="bMenu" aria-label="Menu">${svg('menu', 18, 2.2)}</button>`);
$('bMenu').onclick = () => openMenu();

/* ---------- ride along ---------- */
let pov = null;
const _eye = new THREE.Vector3(), _look = new THREE.Vector3(), _lookS = new THREE.Vector3();
function startPOV(agent, kind) {
  pov = { a: agent, kind, mode: kind === 'car' ? 'chase' : 'eye', fresh: true };
  followTarget = null; closeCard(); if (tab !== 'select') setTab('select');
  camera.near = 0.02; camera.updateProjectionMatrix();
  $('povChip').hidden = false; povChip(); sfx('pick');
  if (!speed && !hardPaused) setSpeed(1);
}
function povChip() { $('povChip').innerHTML = `${svg(pov.kind === 'car' ? 'car' : 'person', 15, 2)}<span>${T(pov.kind === 'car' ? 'pov.car' : 'pov.ped')}</span><kbd>C</kbd><small>${T(pov.mode === 'eye' ? 'pov.chase' : 'pov.eye')}</small><kbd>Esc</kbd><small>${T('pov.stop')}</small>`; }
function stopPOV() {
  if (!pov) return;
  const a = pov.a; pov = null;
  camera.near = 0.1; camera.updateProjectionMatrix();
  rig.tx = cur.tx = clamp(a.x, 0, W); rig.tz = cur.tz = clamp(a.z, 0, H); rig.dist = Math.max(rig.dist, 7);
  $('povChip').hidden = true;
}
function povCam(rdt) {
  let a = pov.a;
  const list = pov.kind === 'car' ? cars : peds;
  if (list.indexOf(a) < 0) {
    // a car that reaches its stop hands the ride to the nearest car; a walker who arrives ends it
    if (pov.kind === 'car') { let best = null, bd = 4; for (const c of cars) { const d = Math.hypot(c.x - a.x, c.z - a.z); if (d < bd) { bd = d; best = c; } } if (best) { pov.a = a = best; } else { stopPOV(); return; } }
    else { stopPOV(); flashTip(T('pov.arrived')); return; }
  }
  const al = agAlpha, x = a.px + (a.x - a.px) * al, z = a.pz + (a.z - a.pz) * al, y = a.py + (a.y - a.py) * al;
  let hx = a.phx + (a.hx - a.phx) * al, hz = a.phz + (a.hz - a.phz) * al; const hl = Math.hypot(hx, hz) || 1; hx /= hl; hz /= hl;
  const car = pov.kind === 'car', eye = pov.mode === 'eye';
  if (eye) { const up = car ? 0.13 : 0.045 + 0.125 * (a.h || 1), fw = car ? 0.03 : 0.04; _eye.set(x + hx * fw, y + up, z + hz * fw); _look.set(x + hx * 2.2, y + up - 0.06, z + hz * 2.2); }
  else { const back = car ? 0.8 : 0.5, up = car ? 0.4 : 0.26; _eye.set(x - hx * back, y + up, z - hz * back); _look.set(x + hx * 0.7, y + (car ? 0.1 : 0.1), z + hz * 0.7); }
  const gy = surfY(clamp(_eye.x, 0, W), clamp(_eye.z, 0, H)) + 0.05; if (_eye.y < gy) _eye.y = gy;
  const k = pov.fresh ? 1 : 1 - Math.exp(-rdt * (eye ? 14 : 7));
  pov.fresh = false;
  camera.position.lerp(_eye, k); _lookS.lerp(_look, k > 0.99 ? 1 : 1 - Math.exp(-rdt * 9));
  if (k >= 1) _lookS.copy(_look);
  camera.lookAt(_lookS); camera.updateMatrixWorld();
  cur.tx = x; cur.tz = z; cur.dist = 8;        // keeps agent drawing and sound centred on the ride
}
function pickCar(p) {
  if (cur.dist > 40) return null;
  let best = null, bd = 22;
  for (const c of cars) { const s = toScreen(c.x, c.y + 0.08, c.z); if (!s) continue; const d = Math.hypot(s.x - p.x, s.y - p.y); if (d < bd) { bd = d; best = c; } }
  return best;
}

    for (let z = 2; z < H; z += 2) for (let x = 2; x < W; x += 2) if (terrainY(x, z) > WL + 0.3) { sx += x; sz += z; n++; }
    if (n) { rig.tx = HOME.tx = sx / n; rig.tz = HOME.tz = sz / n; }
  }

}
/* a highway stub from the edge of the map: the way in for new families, and a place to start */
function buildEntrance() {
  const cands = [];
  for (let k = 0; k < 40; k++) {
    const side = k % 4, f = 0.2 + ((k * 0.618) % 0.6);
    const p = side === 0 ? { x: f * W, z: 0.4, dx: 0, dz: 1 } : side === 1 ? { x: W - 0.4, z: f * H, dx: -1, dz: 0 } : side === 2 ? { x: f * W, z: H - 0.4, dx: 0, dz: -1 } : { x: 0.4, z: f * H, dx: 1, dz: 0 };
    let ok = true, y0 = terrainY(p.x, p.z), rough = 0;
    for (let s = 0; s <= 9; s += 0.5) { const y = terrainY(p.x + p.dx * s, p.z + p.dz * s); if (y < WL + 0.25) { ok = false; break; } rough += Math.abs(y - y0); y0 = y; }
    if (ok) cands.push({ ...p, rough });
  }
  cands.sort((a, b) => a.rough - b.rough);

    const A = { x: c.x, z: c.z }, B = { x: c.x + c.dx * 9, z: c.z + c.dz * 9 }, C = { x: (A.x + B.x) / 2, z: (A.z + B.z) / 2 };
    const p = planRoad(A, C, B);
    if (!p.ok) continue;
    commitRoad(A, C, B, p);
    for (const n of nodes.values()) if (Math.hypot(n.x - A.x, n.z - A.z) < 0.05) n.outside = true;
    rebuildRoadIndex();
    civ.entrance = null; entranceSpot();
    for (const sg of segs.values()) sg.name = 'Highway 1';
    return true;
  }
  return false;
}

/* =====================================================================
   MAIN LOOP
   ===================================================================== */
let waterT = 0, junKey = '', last = performance.now(), acc = 0, fpsT = 0, fpsN = 0, lastFrame = 0, saveTimer = 0, tod = 0.36, treeTimer = 0, fpsShown = false, lastSky = '';
const sunDir = new THREE.Vector3();
const NIGHT_SKY = new THREE.Color(0x101a2c), DAY_SKY = new THREE.Color(0xbcd9ec), DUSK_SKY = new THREE.Color(0xf0a77a);
const WIN_DAY = new THREE.Color(0x33414f), WIN_NIGHT = new THREE.Color(0xffd38a), LAMP_DAY = new THREE.Color(0xd9dde2), LAMP_NIGHT = new THREE.Color(0xfff1c8);
function dayNight(dt) {
  if (!settings.dayNight) tod = 0.36; else if (speed) tod = (tod + dt * SPEEDS[speed] / 480) % 1;
  // tod: 0 midnight, 0.25 sunrise, 0.5 noon, 0.75 sunset
  const a = (tod - 0.25) * Math.PI * 2, el = Math.sin(a);
  const day01 = smooth01(clamp(el * 2.2 + 0.25, 0, 1));
  nightF = 1 - day01;
  sun.position.set(W / 2 + Math.cos(a) * 60, 12 + Math.max(0.12, el) * 62, H / 2 + 28);
  const warm = clamp(1 - Math.abs(el) * 3, 0, 1) * day01;
  sun.intensity = 0.12 + 0.75 * day01;
  hemi.intensity = 0.38 + 0.36 * day01;
  hemi.color.setRGB(lerp(0.55, 0.91, day01), lerp(0.62, 0.95, day01), lerp(0.85, 1, day01));
  sun.color.setRGB(1, 0.95 - warm * 0.25, 0.88 - warm * 0.4);
  const sky = C4.copy(NIGHT_SKY).lerp(DAY_SKY, day01).lerp(DUSK_SKY, warm * 0.55);
  scene.background.copy(sky); scene.fog.color.copy(sky);
  const u = waterMat.uniforms;
  u.uSky.value.copy(sky); u.uFogColor.value.copy(sky); u.uFogNear.value = scene.fog.near; u.uFogFar.value = scene.fog.far;
  sunDir.copy(sun.position).sub(sun.target.position).normalize(); u.uSun.value.copy(sunDir); u.uLight.value = day01;
  // windows, lamps and their pools of light come on at dusk
  const lightOn = smooth01((nightF - 0.25) / 0.4);
  winMat.color.copy(WIN_DAY).lerp(WIN_NIGHT, lightOn);
  lampMat.color.copy(LAMP_DAY).lerp(LAMP_NIGHT, lightOn);
  glowMat.opacity = 0.55 * lightOn;
  const hx = sky.getHexString(); if (hx !== lastSky) { lastSky = hx; frame.style.background = '#' + hx; }
}
/* render loop: 30 / 60 / match the display / unlimited */
const mc = new MessageChannel();
mc.port1.onmessage = () => frameLoop(performance.now());
function schedule() { if (document.hidden) { setTimeout(() => frameLoop(performance.now()), 500); return; } if (false) mc.port2.postMessage(0); else requestAnimationFrame(frameLoop); }
let started = false, photo = false, photoSpeed = 1, barPeek = 0, barT = 2, barB = 2, barR = 2, gx = 0, gy = 0, nightWatch = 0;
addEventListener('pointermove', e => { const r = frame.getBoundingClientRect(); gx = e.clientX - r.left; gy = e.clientY - r.top; if (e.pointerType === 'touch') barPeek = Math.max(barPeek, 0.5); }, { passive: true });
function updateBars(dt) {
  const s = hudSc;
  const busy = settings.pinBars || tab !== 'select' || !!rcard || !$('sheetbg').hidden || !$('views').hidden || (drag && drag.mode !== 'pan' && drag.mode !== 'rotate' && drag.mode !== 'click');
  barPeek = Math.max(0, barPeek - dt);
  const hold = busy || barPeek > 0;
  barT = hold || gy < 92 * s ? 0.9 : Math.max(0, barT - dt);
  barB = hold || gy > ch - 118 * s ? 0.9 : Math.max(0, barB - dt);
  barR = hold || (gx > cw - 96 * s && Math.abs(gy - ch / 2) < 200 * s) ? 0.9 : Math.max(0, barR - dt);
  const t0 = !started || barT <= 0, b0 = !started || barB <= 0, r0 = !started || barR <= 0;
  hudEl.classList.toggle('hideT', t0); hudEl.classList.toggle('hideB', b0); hudEl.classList.toggle('hideR', r0);
}
function frameLoop(now) {
  schedule();
  const fm = String(settings.fpsMode), cap = fm === '30' ? 30 : fm === '60' ? 60 : 0;
  if (cap && now - lastFrame < 1000 / cap - 1.5) return;
  const rdt = Math.min(0.5, (now - last) / 1000), dt = Math.min(0.1, rdt); last = now; lastFrame = now;
  fpsN++; fpsT += dt;
  if (fpsT > 0.5) { if (settings.showFps) { $('fps').textContent = Math.round(fpsN / fpsT) + ' fps'; fpsShown = true; } else if (fpsShown) { $('fps').textContent = ''; fpsShown = false; } fpsN = 0; fpsT = 0; }
  // camera keys and edge scroll
  const cs = settings.camSpeed, mv = cur.dist * 0.9 * dt * cs;
  const fx = -Math.sin(cur.yaw), fz = -Math.cos(cur.yaw), rx = Math.cos(cur.yaw), rz = -Math.sin(cur.yaw);
  let kx = 0, kz = 0;
  if (keys.has('w') || keys.has('arrowup')) kz += 1; if (keys.has('s') || keys.has('arrowdown')) kz -= 1;
  if (keys.has('d') || keys.has('arrowright')) kx += 1; if (keys.has('a') || keys.has('arrowleft')) kx -= 1;
  if (settings.edgeScroll && ptr.in && !drag && started) { if (ptr.x < 14) kx -= 1; if (ptr.x > cw - 14) kx += 1; if (ptr.y < 14) kz += 1; if (ptr.y > ch - 14) kz -= 1; }
  if (kx || kz) { rig.tx += (fx * kz + rx * kx) * mv; rig.tz += (fz * kz + rz * kx) * mv; ptr.dirty = true; followTarget = null; }
  if (keys.has('q')) rig.yaw += 1.6 * dt * cs; if (keys.has('e')) rig.yaw -= 1.6 * dt * cs;
  if (keys.has('+') || keys.has('=')) rig.dist *= 1 - dt * 1.5; if (keys.has('-')) rig.dist *= 1 + dt * 1.5;
  if (!started) rig.yaw += dt * 0.06;
  if (followTarget) { const f = followTarget; rig.tx += (f.x - rig.tx) * Math.min(1, dt * 6); rig.tz += (f.z - rig.tz) * Math.min(1, dt * 6); if (rig.dist > 9) rig.dist += (7 - rig.dist) * Math.min(1, dt * 2); }
  clampRig();

  // simulation at a fixed step; agents at their own fixed step with interpolation
  acc += dt * SPEEDS[speed];
  let n = 0;
  while (acc >= TICK && n++ < 8) { simTick(); acc -= TICK; }
  if (n >= 8) acc = 0;
  calAcc += dt * SPEEDS[speed];
  while (calAcc >= DAY_SEC) { calAcc -= DAY_SEC; day++; calendarDay(); uiDirty = true; }
  paperTick(rdt);
  updateAgents(dt);
  animT += dt * (speed ? Math.max(1, SPEEDS[speed] * 0.6) : 0);
  if (speed && nightF > 0.8) { nightWatch += dt; if (nightWatch > 30) achieve('night', 'Night owl'); } else if (nightF < 0.3) nightWatch = 0;
  // tools
  if (drag && drag.mode === 'terra') { const pt = pickGround(drag.p); if (pt) brushPt = pt; applyBrush(dt); if (brushPt) ring(ringLine, brushPt.x, brushPt.z, [1.4, 2.6, 4.2][brushSize], 0xffffff); }
  if (lasso && lasso.length >= 2) ring(ringLine, lasso[lasso.length - 2], lasso[lasso.length - 1], 0.42, tool === 'zone' && ZONES[zoneType] ? ZONES[zoneType].color : 0xff6b5e);
  if (lasso && lassoT < 0) { lassoT = now; updateLassoLine(); }
  if (lasso && lassoT > 0 && now - lassoT > 170) { lassoT = 0; updateLassoPreview(); }
  if (ptr.dirty && tool !== 'select') processHover(); else if (ptr.dirty) { ptr.dirty = false; showTip(null); }
  // cursor decal: follows the pointer on the same frame, fades in and out softly

  DEC.uDec2.value.set(pulse.x, pulse.z, pulse.r * (1 + smooth01(pulse.t) * 0.45), pulse.t < 1 ? (1 - pulse.t) * 0.9 : 0);

  if (roadsDirty) buildRoads();
  if (lotsDirty) buildLots();
  bldTimer -= dt;
  if (bldDirty && bldTimer <= 0) { buildBuildings(); bldTimer = 0.25; }
  treeTimer -= dt;
  if (treesDirty && treeTimer <= 0) { buildTrees(); treeTimer = drag && drag.mode === 'terra' ? 0.3 : 0; }
  if (uiDirty) updateHUD();
  updateBars(rdt);
  // water and light
  if (speed) waterT += dt * Math.min(2, SPEEDS[speed]);
  waterMat.uniforms.uTime.value = waterT;
  dayNight(dt);
  applyCam(dt);
  if (pov) povCam(rdt);
  // contours: always in the terrain tool; held Shift shows them while drawing roads or zoning
  const topoWant = overlay === 'topo' ? 1 : shiftHeld && (tool === 'road' || tool === 'zone' || tool === 'dezone') ? 1 : 0;
  topoU.value = overlay === 'topo' ? 1 : topoU.value + (topoWant - topoU.value) * Math.min(1, rdt * 10);
  topoN.value = nightF;
  const cn = $('compassN'); if (cn) cn.style.transform = `rotate(${cur.yaw}rad)`;
  ambience(dt); musicTick(dt);
  drawDynamic(now / 1000, dt);
  drawPops(dt);
  renderer.render(scene, camera);
  if (settings.autosave && started) { saveTimer += dt; if (saveTimer > settings.autosave * 60) { saveTimer = 0; save(); } }
}

/* ---------- title card, fullscreen and the resume card ---------- */
const fsOK = () => !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
function goFullscreen() {
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || !fsOK()) return Promise.reject(new Error('unavailable'));
  try { const r = req.call(el, { navigationUI: 'hide' }); return r && r.then ? r : Promise.resolve(); } catch (e) { return Promise.reject(e); }
}
let wasFs = false, resumeSpeed = 1;
function startPlaying() {
  $('title').hidden = true; started = true;
  audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume(); hardPaused = false; sfx('pick');
  if (!speed) setSpeed(1);
  barPeek = 4; uiDirty = true;
}
function titleInfo() {
  const sb = sandbox();
  $('titleSub').textContent = stats.pop > 0 || segs.size > 1 ? `${T('city.pop', { n: fmtN(stats.pop) })} · ${T('biome.' + world.biome)}${sb.money || sb.unlock ? ' · ' + T('title.sandbox') : ''}` : T('title.empty');
  $('fsHint').textContent = fsOK() ? '' : T('title.fsBlocked');

}
$('bPlay').addEventListener('click', () => {
  goFullscreen().then(() => { wasFs = true; }).catch(() => { if (!fsOK()) flashTipSoon(T('title.fsBlocked')); });
  startPlaying();
});
let ncBiome = 'valley';
if (String(settings.fpsMode) === 'unlimited') settings.fpsMode = 'display';
function renderNewCity() {
  const box = $('newCityBox');
  ncBiome = 'valley';
  box.innerHTML = `
    <label class="nclab">${T('title.name')}<input id="nameIn" value="" placeholder="${T('title.namePh')}" spellcheck="false"></label>
    <label class="nclab">${T('title.seed')}<input id="seedIn" value="${ncBiome}-${(Math.random() * 99999) | 0}" spellcheck="false"></label>
    <div class="ncsw"><label><input type="checkbox" id="sbMoney"> ${T('title.money')}</label><label><input type="checkbox" id="sbUnlock"> ${T('title.unlock')}</label></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="play" style="flex:1;font-size:16px;padding:12px" id="bStartNew">${T('title.start')}</button></div><div class="tlinks"><button id="bBack">${T('title.back')}</button></div>`;
}
$('newCityBox').addEventListener('input', e => { if (e.target.id === 'nameIn' && $('bPlay').hidden) document.querySelector('#title h1').textContent = e.target.value.trim() || T('title.newTown'); });
$('bNew').addEventListener('click', () => showCreation(true));

  if (e.target.id === 'bStartNew') {
    const p = parseSeed($('seedIn').value) || { biome: ncBiome, seed: (Math.random() * 99999) | 0 };
    p.biome = 'valley'; p.name = $('nameIn').value.trim(); p.money = $('sbMoney').checked; p.unlock = $('sbUnlock').checked;
    newCity(true, p); applyCam(1); $('newCityBox').hidden = true;
    goFullscreen().then(() => { wasFs = true; }).catch(() => {});
    $('bPlay').hidden = false; $('bNew').hidden = false; firstVisit = false;

});
function flashTipSoon(m) { setTimeout(() => { ptr.x = cw / 2; ptr.y = ch * 0.3; flashTip(m); flashT = 4; }, 600); }

}

$('edgeB').addEventListener('click', () => { barPeek = 5; });
$('edgeT').addEventListener('click', () => { barPeek = 5; });

/* ---------- photo mode and postcards ---------- */

  document.body.classList.add('photo'); $('tiltT').hidden = $('tiltB').hidden = false;
  const pb = $('photobar'); pb.hidden = false;
  pb.innerHTML = `<label>${T('photo.time')} <input type="range" min="0" max="1" step="0.002" value="${tod.toFixed(3)}" id="pTod"></label><label><input type="checkbox" id="pTilt" checked> ${T('photo.tilt')}</label><button class="pill yes" data-act="snap">${T('photo.snap')}</button><button class="pill" data-act="exitPhoto">${T('ui.done')}</button>`;
  $('pTod').addEventListener('input', e => { tod = +e.target.value; });

}

}
function takePostcard() {
  renderer.render(scene, camera);
  const src = cv, w = src.width, h = src.height, pad = Math.round(w * 0.03), foot = Math.round(h * 0.13);
  const c2 = document.createElement('canvas'); c2.width = w + pad * 2; c2.height = h + pad * 2 + foot;
  const g = c2.getContext('2d');

    const m = bg.createLinearGradient(0, 0, 0, h); m.addColorStop(0, '#000'); m.addColorStop(0.28, 'rgba(0,0,0,0)'); m.addColorStop(0.72, 'rgba(0,0,0,0)'); m.addColorStop(1, '#000');

}
$('bPcClose').addEventListener('click', () => { $('postcard').hidden = true; });

})();
