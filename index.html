<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tiny City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --letterbox:#dfe5ec;
  --glass:rgba(255,255,255,.58); --glass-hi:rgba(255,255,255,.78); --glass-edge:rgba(255,255,255,.75);
  --glass-shine:rgba(255,255,255,.75); --shadow:0 10px 34px rgba(20,30,50,.16),0 2px 6px rgba(20,30,50,.08);
  --label:rgba(0,0,0,.88); --label2:rgba(60,60,67,.62); --label3:rgba(60,60,67,.32);
  --sep:rgba(60,60,67,.16); --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.2); --row:rgba(255,255,255,.72);
  --seg-on:#ffffff; --knob:#ffffff; --sheet:rgba(242,242,247,.92); --sidebar:rgba(255,255,255,.55);
  --accent:#007AFF; --green:#34C759; --red:#FF3B30; --orange:#FF9500; --yellow:#FFCC00; --teal:#30B0C7; --indigo:#5856D6; --purple:#AF52DE; --gray:#8E8E93; --brown:#A2845E; --cyan:#32ADE6;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --letterbox:#000;
    --glass:rgba(28,28,30,.52); --glass-hi:rgba(44,44,46,.8); --glass-edge:rgba(255,255,255,.14);
    --glass-shine:rgba(255,255,255,.14); --shadow:0 10px 34px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
    --label:rgba(255,255,255,.95); --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
    --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --row:rgba(44,44,46,.72);
    --seg-on:#636366; --knob:#ffffff; --sheet:rgba(28,28,30,.92); --sidebar:rgba(44,44,46,.55);
    --accent:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --teal:#40C8E0; --indigo:#5E5CE6; --purple:#BF5AF2; --gray:#98989D; --brown:#AC8E68; --cyan:#64D2FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --letterbox:#000;
  --glass:rgba(28,28,30,.52); --glass-hi:rgba(44,44,46,.8); --glass-edge:rgba(255,255,255,.14);
  --glass-shine:rgba(255,255,255,.14); --shadow:0 10px 34px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  --label:rgba(255,255,255,.95); --label2:rgba(235,235,245,.62); --label3:rgba(235,235,245,.3);
  --sep:rgba(84,84,88,.55); --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.34); --row:rgba(44,44,46,.72);
  --seg-on:#636366; --knob:#ffffff; --sheet:rgba(28,28,30,.92); --sidebar:rgba(44,44,46,.55);
  --accent:#0A84FF; --green:#30D158; --red:#FF453A; --orange:#FF9F0A; --yellow:#FFD60A; --teal:#40C8E0; --indigo:#5E5CE6; --purple:#BF5AF2; --gray:#98989D; --brown:#AC8E68; --cyan:#64D2FF;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;overflow:hidden;background:var(--letterbox);color:var(--label);display:flex;align-items:center;justify-content:center;
  font:15px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;letter-spacing:-.01em}
button{font:inherit;color:inherit;letter-spacing:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.num{font-variant-numeric:tabular-nums}
#frame{position:relative;overflow:hidden;background:#bcd9ec;flex:0 0 auto}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;top:0;transform-origin:0 0;pointer-events:none}
#hud .ia{pointer-events:auto}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:30px;color:#1c1c1e;font-size:17px}

/* glass material */
.glass{background:var(--glass);-webkit-backdrop-filter:blur(26px) saturate(1.8);backdrop-filter:blur(26px) saturate(1.8);
  border:.5px solid var(--glass-edge);box-shadow:var(--shadow),inset 0 1px 0 var(--glass-shine);pointer-events:auto}
.capsule{border-radius:999px}
.card{border-radius:26px}
.ico{display:grid;place-items:center}
.ico svg{display:block}

/* top bar */
.tl{position:absolute;left:24px;top:20px;display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 20px}
.cityname{font-size:17px;font-weight:600;outline:none;min-width:40px;max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text;padding:2px 4px;border-radius:6px}
.cityname:hover{background:var(--fill)}
.date{color:var(--label2);font-size:15px;white-space:nowrap}
.dot{width:4px;height:4px;border-radius:2px;background:var(--label3)}
#fps{position:absolute;left:30px;top:80px;font-size:12px;color:var(--label2);pointer-events:none}
.tr{position:absolute;right:24px;top:20px;display:flex;gap:10px;align-items:center}
.stats{display:flex;align-items:center;gap:18px;height:52px;padding:0 20px}
.stat{display:flex;align-items:center;gap:7px;font-weight:600;font-size:16px;white-space:nowrap}
.stat small{font-weight:500;font-size:13px}
.up{color:var(--green)} .down{color:var(--red)}
.rbtn{width:52px;height:52px;border-radius:26px;border:0;display:grid;place-items:center;cursor:pointer;color:var(--label)}
.rbtn:hover{background:var(--glass-hi)}
.rbtn.on{color:var(--accent)}
.campill{position:absolute;right:24px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;padding:6px;border-radius:26px}
.campill button{width:40px;height:40px;border:0;background:transparent;border-radius:20px;display:grid;place-items:center;cursor:pointer;color:var(--label)}
.campill button:hover{background:var(--fill)}

/* segmented control */
.segm{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:0;position:relative}
.segm button{flex:1 1 0;border:0;background:transparent;border-radius:8px;padding:6px 12px;font-size:13px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--label);display:flex;align-items:center;justify-content:center;gap:6px}
.segm button.on{background:var(--seg-on);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
.segm.small button{padding:5px 10px}
.speed{margin-left:6px;border-radius:999px}
.speed button{border-radius:999px;padding:7px 12px;min-width:44px}

/* switch */
.switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);border:0;position:relative;cursor:pointer;flex:0 0 auto;transition:background .2s}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:27px;height:27px;border-radius:50%;background:var(--knob);box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(20px)}

/* slider */
input[type=range]{-webkit-appearance:none;appearance:none;width:220px;height:28px;background:transparent;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--fill2) var(--p,50%))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:linear-gradient(90deg,var(--accent) var(--p,50%),var(--fill2) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:#fff;margin-top:-12px;box-shadow:0 3px 8px rgba(0,0,0,.18),0 0 0 .5px rgba(0,0,0,.06)}
input[type=range]::-moz-range-thumb{width:28px;height:28px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.18)}

/* tab bar and palette */
.tabbar{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:2px;padding:6px;border-radius:999px}
.tab{width:84px;height:60px;border:0;background:transparent;border-radius:999px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;cursor:pointer;color:var(--label)}
.tab:hover{background:var(--fill)}
.tab.on{color:var(--accent);background:var(--glass-hi);box-shadow:0 2px 10px rgba(0,0,0,.08),inset 0 0 0 .5px var(--glass-edge)}
.palette{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);padding:14px;border-radius:28px;display:flex;flex-direction:column;gap:12px;max-width:1300px}
.prow{display:flex;gap:10px;align-items:center;justify-content:center}
.tcard{width:156px;border:0;background:var(--fill);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;cursor:pointer;text-align:left;color:var(--label)}
.tcard:hover{background:var(--fill2)}
.tcard.on{background:var(--glass-hi);box-shadow:inset 0 0 0 2px var(--accent)}
.tcard .tile{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:#fff}
.tcard b{font-size:14px;font-weight:600;line-height:1.2}
.tcard small{font-size:12px;color:var(--label2);line-height:1.3}
.tcard .price{font-size:13px;font-weight:600;color:var(--accent)}
.hintline{font-size:13px;color:var(--label2);text-align:center}
.tcard.locked{opacity:.62}
.tcard.locked .price{color:var(--label2)}
.rci-mini{display:flex;gap:3px;align-items:center;padding-left:4px}
.rci-big{display:flex;gap:8px;align-items:flex-end;padding:8px 12px;margin-right:4px;background:var(--fill);border-radius:18px;align-self:stretch}
.rci-b{display:flex;flex-direction:column;align-items:center;gap:4px}
.rci-b small{font-size:11px;font-weight:600;color:var(--label2)}
.rci-t{position:relative;background:var(--fill2);border-radius:4px;overflow:hidden;display:block}
.rci-t::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--label3)}
.rci-t i{position:absolute;left:0;right:0;border-radius:3px}
.optrow{display:flex;align-items:center;gap:10px;font-size:14px}

/* side cards */
.lcol{position:absolute;left:24px;top:86px;width:340px;display:flex;flex-direction:column;gap:12px}
.rcol{position:absolute;right:92px;top:86px;width:360px}
.chead{display:flex;align-items:flex-start;gap:10px;padding:18px 18px 10px}
.chead h2{margin:0;font-size:22px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.chead p{margin:3px 0 0;color:var(--label2);font-size:14px}
.closeb{margin-left:auto;width:30px;height:30px;border-radius:15px;border:0;background:var(--fill);display:grid;place-items:center;cursor:pointer;color:var(--label2);flex:0 0 auto}
.closeb:hover{background:var(--fill2)}
.cbody{padding:0 14px 16px;max-height:600px;overflow:auto}
.group{background:var(--row);border-radius:14px;overflow:hidden;margin-top:10px}
.ghead{font-size:13px;color:var(--label2);margin:16px 6px 0;font-weight:500}
.row{display:flex;align-items:center;gap:12px;min-height:44px;padding:8px 14px;position:relative}
.row + .row::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.row .k{flex:1;min-width:0}
.row .v{color:var(--label2);font-variant-numeric:tabular-nums;text-align:right}
.row .v.good{color:var(--green)} .row .v.bad{color:var(--red)} .row .v.warn{color:var(--orange)}
.row.btn{cursor:pointer;border:0;width:100%;background:transparent;text-align:left;color:var(--accent);font-weight:500}
.row.btn:hover{background:var(--fill)}
.row.danger{color:var(--red)}
.isq{width:29px;height:29px;border-radius:7px;display:grid;place-items:center;color:#fff;flex:0 0 auto}
.chev{color:var(--label3)}
.bar{height:6px;border-radius:3px;background:var(--fill2);overflow:hidden;width:120px;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.grad{height:10px;border-radius:5px;margin:4px 0 6px}
.gl{display:flex;justify-content:space-between;font-size:12px;color:var(--label2)}
.sw{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
.dem{display:grid;grid-template-columns:96px 1fr;align-items:center;gap:10px;padding:6px 14px}
.dem .track{height:10px;border-radius:5px;background:var(--fill2);position:relative;overflow:hidden}
.dem .track::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--label3)}
.dem .track i{position:absolute;top:0;bottom:0;border-radius:5px;transition:left .3s,width .3s}
.armrow{display:flex;align-items:center;gap:10px;padding:8px 14px;position:relative}
.armrow + .armrow::before{content:"";position:absolute;left:14px;right:0;top:0;height:.5px;background:var(--sep)}
.armrow .k{flex:1}
.empty{padding:16px;color:var(--label2);text-align:center}

/* banners */
#banners{position:absolute;left:50%;top:18px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;width:440px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:22px;animation:bin .35s cubic-bezier(.2,.9,.3,1.2)}
.banner .isq{width:38px;height:38px;border-radius:10px}
.banner .bt{flex:1;min-width:0}
.banner .bt b{display:block;font-size:13px;font-weight:600;color:var(--label2)}
.banner .bt span{font-size:15px}
.banner .when{font-size:12px;color:var(--label3);align-self:flex-start}
.banner.out{animation:bout .3s forwards}
@keyframes bin{from{transform:translateY(-30px);opacity:0}to{transform:none;opacity:1}}
@keyframes bout{to{transform:translateY(-20px);opacity:0}}

/* tooltip */
#tip{position:absolute;padding:7px 12px;border-radius:14px;font-size:13px;font-weight:500;line-height:1.35;display:none;pointer-events:none;max-width:280px}
#tip .bad{color:var(--red)} #tip .muted{color:var(--label2)}

/* sheets */
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.22);display:grid;place-items:center;pointer-events:auto}
.sheet{width:940px;height:640px;border-radius:30px;display:flex;overflow:hidden;background:var(--sheet)}
.sheet.small{width:560px;height:auto;flex-direction:column}
.side{width:250px;background:var(--sidebar);padding:22px 12px;display:flex;flex-direction:column;gap:4px;border-right:.5px solid var(--sep)}
.side h1{font-size:28px;font-weight:700;margin:4px 10px 14px;letter-spacing:-.02em}
.sitem{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;border:0;background:transparent;cursor:pointer;text-align:left;font-size:16px;color:var(--label)}
.sitem:hover{background:var(--fill)}
.sitem.on{background:var(--accent);color:#fff}
.sitem.on .isq{box-shadow:0 0 0 1.5px rgba(255,255,255,.6)}
.smain{flex:1;display:flex;flex-direction:column;min-width:0}
.sbar{display:flex;align-items:center;padding:20px 26px 6px}
.sbar h2{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em}
.done{margin-left:auto;border:0;background:var(--accent);color:#fff;font-weight:600;padding:9px 20px;border-radius:999px;cursor:pointer}
.done:hover{filter:brightness(1.08)}
.scontent{flex:1;overflow:auto;padding:4px 26px 26px}
.foot{font-size:13px;color:var(--label2);margin:8px 6px 0;line-height:1.4}
.wbody{padding:6px 28px 26px;line-height:1.5}
.wbody ol{margin:6px 0 10px;padding-left:22px}
.wbody li{margin:4px 0}
.wbody p{color:var(--label2);font-size:14px;margin:8px 0}
.bigbtn{display:block;width:100%;border:0;background:var(--accent);color:#fff;font-weight:600;font-size:17px;padding:14px;border-radius:16px;cursor:pointer;margin-top:14px}
@media (prefers-reduced-motion: reduce){ .banner,.banner.out{animation:none} .switch,.switch::after,.dem .track i{transition:none} }
</style>
</head>
<body>
<div id="frame">
  <canvas id="cv"></canvas>
  <div id="err">WebGL isn't available in this browser, so the city can't be shown.</div>
  <div id="hud">
    <div class="tl glass capsule">
      <div class="cityname ia" id="cityName" contenteditable="true" spellcheck="false" title="Rename your city">Tiny City</div>
      <span class="dot"></span>
      <span class="date num" id="date">January 1, 2030</span>
      <div class="segm speed ia" id="speed"></div>
    </div>
    <div id="fps" class="num"></div>
    <div class="tr">
      <div class="glass capsule stats">
        <span class="stat"><span class="ico" id="iPop"></span><span class="num" id="pop">0</span><small class="num" id="popD"></small></span>
        <span class="stat"><span class="ico" id="iMoney"></span><span class="num" id="money">$0</span><small class="num" id="net"></small></span>
        <span class="stat" title="Happiness"><span class="ico" id="iHappy"></span><span class="num" id="happy">70%</span></span>
        <span class="rci-mini" id="rci" title="Zone demand: residential, commercial, offices, industrial"></span>
      </div>
      <button class="glass rbtn" id="bViews" aria-label="Info views" title="Info views (V)"></button>
      <button class="glass rbtn" id="bCity" aria-label="City overview" title="City overview"></button>
      <button class="glass rbtn" id="bSet" aria-label="Settings" title="Settings"></button>
    </div>
    <div class="glass campill" id="campill"></div>
    <div class="lcol">
      <div class="glass card" id="views" hidden></div>
      <div class="glass card" id="legend" hidden></div>
    </div>
    <div class="rcol"><div class="glass card" id="rcard" hidden></div></div>
    <div class="glass palette" id="palette" hidden></div>
    <div class="glass tabbar" id="tabbar"></div>
    <div id="banners"></div>
    <div class="glass" id="tip"></div>
    <div class="sheetbg" id="sheetbg" hidden><div class="sheet glass" id="sheet"></div></div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
'use strict';
/* =====================================================================
   CONSTANTS
   ===================================================================== */
const W = 96, H = 64;                        // world size in units
const TR = 2, TW = W * TR + 1, TH = H * TR + 1, TN = TW * TH;   // terrain vertex grid
const FN = W * H;                            // hidden simulation field cells (1 unit)
const WL = 0.5, MAXH = 7;
const ROAD_HW = 0.36, WALK = 0.15, LOT_OFF = 0.53;
const TICK = 0.4, SPEEDS = [0, 1, 2, 4];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const MILESTONES = [[0, 'Hamlet'], [60, 'Village'], [250, 'Small town'], [600, 'Town'], [1200, 'Large town'], [2500, 'Small city'], [5000, 'City'], [10000, 'Big city'], [20000, 'Metropolis']];
const ZONES = {
  R: { name: 'Residential', depth: [1.45, 1.7, 2.0], w: [0.95, 1.1, 1.35], color: 0x5cc36b, ui: 'var(--green)', dens: [1, 2, 3] },
  C: { name: 'Commercial', depth: [1.5, 1.75, 2.0], w: [1.15, 1.3, 1.45], color: 0x3c8ff0, ui: 'var(--accent)', dens: [1, 2, 3] },
  O: { name: 'Offices', depth: [1.7, 1.9, 2.1], w: [1.3, 1.4, 1.5], color: 0x8e6cf0, ui: 'var(--purple)', dens: [2, 3] },
  I: { name: 'Industrial', depth: [2.0, 2.0, 2.0], w: [1.45, 1.45, 1.45], color: 0xf0a52e, ui: 'var(--orange)', dens: [1] },
};
const DENS = [0, 1, 2.3, 4.2], DENS_NAME = ['', 'Low', 'Medium', 'High'];
const POP = [0, 6, 14, 30], JOBC = [0, 4, 9, 18], JOBI = [0, 6, 13, 24], JOBO = [0, 8, 18, 34];
/* what each milestone unlocks (index into MILESTONES) */
const UNLOCK = { park: 0, coal: 0, wind: 0, pump: 0, well: 0, school: 1, police: 1, fire: 1, mine: 1, hospital: 2, oil: 2, O: 2, dens2: 2, dens3: 3 };
const UNLOCK_NAME = { school: 'Schools', police: 'Police stations', fire: 'Fire stations', mine: 'Ore mines', hospital: 'Hospitals', oil: 'Oil extractors', O: 'Office zoning', dens2: 'Medium density', dens3: 'High density' };
/* placeable buildings */
const SVC = {
  school:   { name: 'School', w: 1.8, d: 1.3, cost: 1800, upkeep: 60, radius: 11, field: 'edu', pw: 6, wt: 4, cat: 'svc', icon: 'book', col: '#5856D6' },

const segm = (name, opts, cur, cls = '') => `<div class="segm ${cls}" role="radiogroup">${opts.map(([v, label, icon]) => `<button class="${String(cur) === String(v) ? 'on' : ''}" data-set="${name}" data-v="${v}" role="radio" aria-checked="${String(cur) === String(v)}">${icon ? svg(icon, 16) : ''}${label}</button>`).join('')}</div>`;

const NOTE = { fire: ['flame', 'var(--orange)'], res: ['pick', 'var(--brown)'], power: ['bolt', 'var(--yellow)'], water: ['drop', 'var(--cyan)'], smog: ['cloud', 'var(--brown)'], trophy: ['trophy', 'var(--yellow)'], info: ['info', 'var(--accent)'], warn: ['info', 'var(--red)'], save: ['info', 'var(--green)'] };
function dateStr() { const m = Math.floor(day % 360 / 30); return `${MONTHS[m]} ${day % 30 + 1}, ${2030 + Math.floor(day / 360)}`; }
function notify(kind, msg, warn) {
  const [icon, col] = NOTE[kind] || NOTE.info;
  sfx(warn ? 'error' : kind === 'trophy' ? 'fanfare' : 'note');
  if (!(feed[0] && feed[0].msg === msg)) { feed.unshift({ icon, col, msg, date: dateStr() }); if (feed.length > 50) feed.pop(); }
  const b = document.createElement('div');
  b.className = 'banner glass';
  b.innerHTML = `${sq(icon, col, 20)}<div class="bt"><b>${cityName}</b><span>${msg}</span></div><span class="when">now</span>`;
  const box = $('banners');
  while (box.children.length > 2) box.firstChild.remove();
  box.appendChild(b);
  setTimeout(() => { b.classList.add('out'); setTimeout(() => b.remove(), 320); }, warn ? 4200 : 3200);
  if (rcard === 'city' && cityTab === 'messages') uiDirty = true;
}

  const fx = -Math.sin(cur.yaw), fz = -Math.cos(cur.yaw), rx = Math.cos(cur.yaw), rz = -Math.sin(cur.yaw);
  let kx = 0, kz = 0;
  if (keys.has('w') || keys.has('arrowup')) kz += 1; if (keys.has('s') || keys.has('arrowdown')) kz -= 1;
  if (keys.has('d') || keys.has('arrowright')) kx += 1; if (keys.has('a') || keys.has('arrowleft')) kx -= 1;
  if (settings.edgeScroll && ptr.in && !drag) { if (ptr.x < 14) kx -= 1; if (ptr.x > cw - 14) kx += 1; if (ptr.y < 14) kz += 1; if (ptr.y > ch - 14) kz -= 1; }
  if (kx || kz) { rig.tx += (fx * kz + rx * kx) * mv; rig.tz += (fz * kz + rz * kx) * mv; ptr.dirty = true; }
  if (keys.has('q')) rig.yaw += 1.6 * dt * cs; if (keys.has('e')) rig.yaw -= 1.6 * dt * cs;
  if (keys.has('+') || keys.has('=')) rig.dist *= 1 - dt * 1.5; if (keys.has('-')) rig.dist *= 1 + dt * 1.5;
  clampRig();
  // simulation at a fixed step
  acc += dt * SPEEDS[speed];
  let n = 0;
  while (acc >= TICK && n++ < 8) { simTick(); acc -= TICK; }
  if (n >= 8) acc = 0;
  updateAgents(dt);
  animT += dt * (speed ? Math.max(1, SPEEDS[speed] * 0.6) : 0);
  // tools
  if (drag && drag.mode === 'terra') { const pt = pickGround(drag.p); if (pt) brushPt = pt; applyBrush(dt); showTip(drag.p, `$${fmt(terraSpent)}`); if (brushPt) ring(ringLine, brushPt.x, brushPt.z, [1.4, 2.6, 4.2][brushSize], 0xffffff); }
  if (lasso && lassoT < 0) { lassoT = now; }
  if (lasso && lassoT > 0 && now - lassoT > 70) { lassoT = 0; updateLassoPreview(); }
  if (ptr.dirty && tool !== 'select') processHover(); else if (ptr.dirty) { ptr.dirty = false; showTip(null); }
  // rebuild only what changed
  if (terrainDirty) { rebuildTerrain(true); terrainDirty = false; terrainColorDirty = false; treesDirty = true; } else if (terrainColorDirty || (overlayDirty && overlay)) { rebuildTerrain(false); terrainColorDirty = false; overlayDirty = false; }
  if (roadsDirty) buildRoads();
  if (lotsDirty) buildLots();
  bldTimer -= dt;
  if (bldDirty && bldTimer <= 0) { buildBuildings(); bldTimer = 0.25; }
  treeTimer -= dt;
  if (treesDirty && treeTimer <= 0) { buildTrees(); treeTimer = drag && drag.mode === 'terra' ? 0.3 : 0; }
  if (uiDirty) updateHUD();
  // water and light
  if (speed) waterT += dt * Math.min(2, SPEEDS[speed]);
  waterMat.uniforms.uTime.value = waterT;
  dayNight(dt);
  applyCam(dt);
  // colour-coded approaches while the intersection editor is open
  if (rcard === 'junction') { if (junDirty || junKey !== selJ + ':' + hoverArm) { junKey = selJ + ':' + hoverArm; prevBuf.reset(); junctionMarkers(); prevBuf.commit(); junDirty = false; } }
  else if (junKey) { junKey = ''; prevBuf.reset(); prevBuf.commit(); }
  topoU.value = overlay === 'topo' ? 1 : 0;
  const cn = $('compassN'); if (cn) cn.style.transform = `rotate(${cur.yaw}rad)`;
  ambience(dt);
  drawDynamic(now / 1000, dt);
  renderer.render(scene, camera);
  if (settings.autosave) { saveTimer += dt; if (saveTimer > settings.autosave * 60) { saveTimer = 0; save(); } }
}

/* =====================================================================
   START
   ===================================================================== */
applyAppearance();
renderTabbar(); renderPalette(); renderSpeed();
new ResizeObserver(resize).observe(document.body);
resize(); applyShadows(); applyFog();
waterMat.uniforms.uAnim.value = settings.water === 'animated' ? 1 : 0;
newCity(false);
applyCam(1);
addEventListener('pagehide', save);
requestAnimationFrame(frameLoop);
})();

</script>
